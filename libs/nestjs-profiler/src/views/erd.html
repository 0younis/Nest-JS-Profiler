<script>
// ── Mermaid loader (idempotent — safe on SPA re-navigation) ─────────────────
// Instead of a <script src="..."> tag (which reExecScripts re-fires async and
// races with this inline script), we load Mermaid once via a dynamic element
// and resolve immediately on subsequent visits where window.mermaid is already
// present. This eliminates the "mermaid is not defined" ReferenceError.
function loadMermaid() {
  // Use window._mermaidReadyPromise so the cached promise survives SPA
  // re-execution of this script block (var declarations reset, window doesn't).
  if (window._mermaidReadyPromise) return window._mermaidReadyPromise;
  window._mermaidReadyPromise = new Promise(function(resolve) {
    if (typeof mermaid !== 'undefined') { resolve(); return; }
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
    s.onload = function() {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        er: { diagramPadding: 40, layoutDirection: 'TB', minEntityWidth: 100, minEntityHeight: 75, entityPadding: 15 },
        securityLevel: 'loose',
        fontFamily: 'Inter, system-ui, sans-serif',
      });
      resolve();
    };
    document.head.appendChild(s);
  });
  return window._mermaidReadyPromise;
}

// ── ERD localStorage cache (TTL: 1 day) ───────────────────────────────────
var ERD_CACHE_KEY = 'nestjs_profiler_erd';
var ERD_CACHE_TTL = 24 * 60 * 60 * 1000;

function saveErdCache(schemas) {
  try {
    localStorage.setItem(ERD_CACHE_KEY, JSON.stringify({ schemas, ts: Date.now() }));
  } catch(e) { /* storage full */ }
}

function loadErdCache() {
  try {
    const raw = localStorage.getItem(ERD_CACHE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    if (!data || !data.schemas || !data.ts) return null;
    if (Date.now() - data.ts > ERD_CACHE_TTL) { localStorage.removeItem(ERD_CACHE_KEY); return null; }
    return data;
  } catch(e) { return null; }
}

function formatCacheTs(ts) {
  return 'Last generated: ' + new Date(ts).toLocaleString(undefined, {
    month: 'short', day: 'numeric', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
}

function showCacheTs(ts) {
  const el = document.getElementById('erd-last-generated');
  if (el) { el.textContent = formatCacheTs(ts); el.style.display = 'inline'; }
}

var activeTab = 0;

// ── Zoom & pan state per panel ─────────────────────────────────────────────
var panState = {};

function initPanZoom(wrapId, innerId) {
  const wrap = document.getElementById(wrapId);
  const inner = document.getElementById(innerId);
  if (!wrap || !inner) return;

  let startX = 0, startY = 0, scrollLeft = 0, scrollTop = 0, dragging = false;

  wrap.addEventListener('mousedown', (e) => {
    dragging = true;
    startX = e.pageX - wrap.offsetLeft;
    startY = e.pageY - wrap.offsetTop;
    scrollLeft = wrap.scrollLeft;
    scrollTop  = wrap.scrollTop;
  });
  document.addEventListener('mouseup', () => { dragging = false; });
  wrap.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    const x = e.pageX - wrap.offsetLeft;
    const y = e.pageY - wrap.offsetTop;
    wrap.scrollLeft = scrollLeft - (x - startX);
    wrap.scrollTop  = scrollTop  - (y - startY);
  });
}


// ── Tab switching ──────────────────────────────────────────────────────────
function switchTab(idx) {
  activeTab = idx;
  document.querySelectorAll('.erd-panel').forEach((p, i) => {
    p.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('border-indigo-600', i === idx);
    b.classList.toggle('text-indigo-700',   i === idx);
    b.classList.toggle('border-transparent', i !== idx);
    b.classList.toggle('text-gray-500',      i !== idx);
  });
}

// ── Count cardinalities ────────────────────────────────────────────────────
function countCardinalities(schema) {
  const one2one = (schema.relations || []).filter(r => r.cardinality === '1:1').length;
  const one2many = (schema.relations || []).filter(r => r.cardinality === '1:N').length;
  return { one2one, one2many };
}

// ── Build sidebar ─────────────────────────────────────────────────────────
function buildSidebar(schema, idx) {
  const { one2one, one2many } = countCardinalities(schema);
  const sourceBadge = schema.source === 'postgresql' ? 'PostgreSQL'
    : schema.source === 'mysql' ? 'MySQL' : 'ORM Entities';

  const tableItems = schema.tables.map(t => `
    <button class="erd-table-btn" onclick="scrollToTable_${idx}('${t.name}')" title="${t.name}">
      ${t.name}
    </button>`).join('');

  return `
    <div class="erd-sidebar">
      <div class="erd-sidebar-header">
        <h3>${sourceBadge}</h3>
        <div class="erd-sidebar-stats">
          <span class="erd-stat-chip">🗂 ${schema.tableCount} tables</span>
          ${one2many > 0 ? `<span class="erd-stat-chip">1:N ${one2many}</span>` : ''}
          ${one2one  > 0 ? `<span class="erd-stat-chip">1:1 ${one2one}</span>`  : ''}
        </div>
      </div>
      <div class="erd-sidebar-list">${tableItems}</div>
    </div>`;
}

// ── Main render ────────────────────────────────────────────────────────────
async function renderSchemas() {
  await loadMermaid();
  const schemas = ERD_SCHEMAS;

  if (!schemas || schemas.length === 0) {
    document.getElementById('erd-empty').classList.remove('hidden');
    document.getElementById('erd-content').classList.add('hidden');
    return;
  }

  document.getElementById('erd-empty').classList.add('hidden');
  document.getElementById('erd-content').classList.remove('hidden');

  // Tabs (only if > 1 source)
  const tabNav = document.getElementById('tab-nav');
  if (schemas.length > 1) {
    document.getElementById('erd-tabs').classList.remove('hidden');
    tabNav.innerHTML = schemas.map((s, i) => `
      <button class="tab-btn whitespace-nowrap pb-3 px-1 border-b-2 text-sm font-medium transition-colors ${i === 0 ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}"
        onclick="switchTab(${i})">
        ${s.label}
      </button>`).join('');
  }

  // Panels
  const panelsEl = document.getElementById('schema-panels');
  panelsEl.innerHTML = schemas.map((s, i) => `
    <div class="erd-panel ${i === 0 ? 'active' : ''}" id="panel-${i}">
      ${s.error ? `<div class="erd-warn mb-3">⚠️ ${s.error}</div>` : ''}
      ${s.tableCount > 0 ? `
        <div class="erd-layout">
          ${buildSidebar(s, i)}
          <div class="erd-diagram-area">
            <div class="erd-diagram-toolbar">
              <span class="erd-toolbar-label">${s.label}</span>
              <div class="erd-toolbar-btns">
                <button class="zoom-btn primary" onclick="openModal(${i})" title="Open fullscreen" style="font-size:11px;padding:0 10px;gap:4px;">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
                  Full
                </button>
              </div>
            </div>
            <div class="diagram-wrap" id="wrap-${i}">
              <div class="diagram-inner" id="inner-${i}">
                <div id="mermaid-${i}" class="mermaid"></div>
              </div>
            </div>
          </div>
        </div>` : `
        <div class="flex items-center justify-center h-48 bg-gray-50 rounded-xl border border-dashed border-gray-300">
          <p class="text-gray-400 text-sm">No tables to display</p>
        </div>`}
    </div>`).join('');

  // Render Mermaid diagrams
  for (let i = 0; i < schemas.length; i++) {
    const s = schemas[i];
    if (s.tableCount === 0) continue;
    const el = document.getElementById(`mermaid-${i}`);
    if (!el) continue;
    try {
      // Use a unique ID each render to avoid Mermaid's duplicate-ID error
      // on SPA re-navigation (it caches processed IDs internally).
      const { svg } = await mermaid.render(`erd-svg-${i}-${Date.now()}`, s.mermaid);
      el.innerHTML = svg;

      const svgEl = el.querySelector('svg');
      if (svgEl) {
        svgEl.setAttribute('width', '100%');
        svgEl.removeAttribute('height');
        svgEl.style.width  = '100%';
        svgEl.style.height = 'auto';
        svgEl.style.minWidth = '';
        panState[`wrap-${i}`] = { scale: 1 };
      }

      initPanZoom(`wrap-${i}`, `inner-${i}`);

      // Register scroll-to-table helper for this panel
      window[`scrollToTable_${i}`] = function(tableName) {
        const wrap = document.getElementById(`wrap-${i}`);
        if (!wrap) return;
        // Find the rect element inside the SVG that corresponds to the table
        const svg = wrap.querySelector('svg');
        if (!svg) return;
        // Mermaid labels the entity group with the table name
        const texts = svg.querySelectorAll('text');
        for (const t of texts) {
          if (t.textContent.trim() === tableName) {
            const bbox = t.getBoundingClientRect();
            const wrapBox = wrap.getBoundingClientRect();
            const scale = panState[`wrap-${i}`]?.scale || 1;
            const svgBox = svg.getBoundingClientRect();
            wrap.scrollLeft = (bbox.left - svgBox.left) / scale - 40;
            wrap.scrollTop  = (bbox.top  - svgBox.top)  / scale - 40;
            break;
          }
        }
      };
    } catch (err) {
      console.error('[ERD] Mermaid render error for schema', i, err);
      el.innerHTML = `<pre class="text-xs text-red-600 bg-red-50 p-4 rounded overflow-auto">${s.mermaid}</pre>
        <p class="text-xs text-red-500 mt-2">Render error: ${err.message}</p>`;
    }
  }
}

// ── Generate / Refresh ERD ─────────────────────────────────────────────────
function setErdBtnLoading(loading) {
  const btn   = document.getElementById('erd-generate-btn');
  const icon  = btn?.querySelector('.erd-btn-icon');
  const spin  = btn?.querySelector('.erd-spinner');
  const label = btn?.querySelector('.erd-btn-loading-text');
  if (!btn) return;
  btn.disabled = loading;
  if (icon)  icon.style.display  = loading ? 'none'         : 'inline-flex';
  if (spin)  spin.style.display  = loading ? 'inline-block' : 'none';
  if (label) label.style.display = loading ? 'inline'       : 'none';
}

async function refreshErd() {
  setErdBtnLoading(true);
  try {
    const res = await fetch('/__profiler/api/erd');
    const fresh = await res.json();

    if (!document.getElementById('schema-panels')) return;

    ERD_SCHEMAS.length = 0;
    fresh.forEach(s => ERD_SCHEMAS.push(s));
    document.getElementById('schema-panels').innerHTML = '';
    document.getElementById('tab-nav').innerHTML = '';
    document.getElementById('erd-tabs').classList.add('hidden');
    await renderSchemas();
    const targetTab = typeof activeTab !== 'undefined' && activeTab < fresh.length ? activeTab : 0;
    switchTab(targetTab);

    // Persist to localStorage with current timestamp
    const now = Date.now();
    saveErdCache(fresh);
    showCacheTs(now);
  } catch (e) {
    alert('Failed to generate ERD: ' + e.message);
  } finally {
    setErdBtnLoading(false);
  }
}

// ── Fullscreen modal ───────────────────────────────────────────────────────
var modalScale = 1;
var modalDragging = false, modalStartX = 0, modalStartY = 0, modalScrollLeft = 0, modalScrollTop = 0;
var modalNaturalW = 800;

function openModal(i) {
  const srcSvg = document.querySelector(`#mermaid-${i} svg`);
  if (!srcSvg) return;

  const modal     = document.getElementById('erd-modal');
  const inner     = document.getElementById('erd-modal-inner');
  const wrap      = document.getElementById('erd-modal-wrap');
  const title     = document.getElementById('erd-modal-title');

  // Clone the SVG so the original stays intact
  const cloned = srcSvg.cloneNode(true);
  inner.innerHTML = '';
  inner.appendChild(cloned);

  // Read natural dimensions from viewBox; set SVG to natural width so fit works
  const vb = cloned.getAttribute('viewBox');
  if (vb) {
    const parts = vb.trim().split(/[\s,]+/);
    if (parts.length >= 4) {
      modalNaturalW = Math.max(parseFloat(parts[2]) || 800, 100);
    }
  }
  cloned.style.width = modalNaturalW + 'px';
  cloned.setAttribute('width', modalNaturalW + 'px');
  cloned.style.height = 'auto';
  cloned.removeAttribute('height');

  // Update title
  const schema = ERD_SCHEMAS[i];
  title.textContent = (schema?.label || 'ERD') + ' — Full View';

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';

  // Auto-fit on open
  requestAnimationFrame(() => {
    modalZoom(null);
    wrap.scrollTo(0, 0);
  });

  // Pan
  wrap.onmousedown = (e) => {
    modalDragging = true;
    modalStartX = e.pageX - wrap.offsetLeft;
    modalStartY = e.pageY - wrap.offsetTop;
    modalScrollLeft = wrap.scrollLeft;
    modalScrollTop  = wrap.scrollTop;
  };
  document.onmouseup = () => { modalDragging = false; };
  wrap.onmousemove = (e) => {
    if (!modalDragging) return;
    e.preventDefault();
    wrap.scrollLeft = modalScrollLeft - (e.pageX - wrap.offsetLeft - modalStartX);
    wrap.scrollTop  = modalScrollTop  - (e.pageY - wrap.offsetTop  - modalStartY);
  };

  // Wheel zoom
  wrap.onwheel = (e) => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.9 : 1.1;
    modalZoom(factor);
  };
}

function closeModal() {
  document.getElementById('erd-modal').classList.remove('open');
  document.body.style.overflow = '';
}

function modalZoom(factor, reset) {
  const inner = document.getElementById('erd-modal-inner');
  const wrap  = document.getElementById('erd-modal-wrap');
  const svgEl = inner?.querySelector('svg');
  if (!svgEl || !wrap) return;

  if (reset) {
    // 1:1 — natural size
    svgEl.style.width = modalNaturalW + 'px';
    svgEl.setAttribute('width', modalNaturalW + 'px');
    modalScale = 1;
  } else if (factor === null) {
    // Fit to available modal width
    const availW = wrap.clientWidth - 80;
    svgEl.style.width = availW + 'px';
    svgEl.setAttribute('width', availW + 'px');
    modalScale = availW / modalNaturalW;
  } else {
    modalScale = Math.min(Math.max(modalScale * factor, 0.1), 10);
    const newW = modalNaturalW * modalScale;
    svgEl.style.width = newW + 'px';
    svgEl.setAttribute('width', newW + 'px');
  }
  svgEl.style.height = 'auto';
  svgEl.removeAttribute('height');
}

// Close on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ── Boot ───────────────────────────────────────────────────────────────────
// On load: restore from localStorage cache (if within 1-day TTL), otherwise
// show empty state. User can always click Generate ERD to refresh.
// loadMermaid() is awaited inside renderSchemas(), so the CDN is always ready
// before any mermaid.render() call — even on SPA re-navigation.
(async function boot() {
  const cached = loadErdCache();
  if (!cached) return; // no valid cache — show empty state, wait for user

  ERD_SCHEMAS.length = 0;
  cached.schemas.forEach(s => ERD_SCHEMAS.push(s));
  await renderSchemas(); // renderSchemas awaits loadMermaid() internally
  switchTab(0);
  showCacheTs(cached.ts);
})();
</script>
